name: E2E Platform

# This suite boots many complete Docker stacks. It is intentionally manual so a
# normal push cannot unexpectedly consume a large number of runner minutes.

on:
  workflow_dispatch:

concurrency:
  group: e2e-platform-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        profile:
          - baseline
          - bypasser-external
          - bypasser-disabled
          - dns-manual
          - dns-blocked
          - dns-doh
          - proxy-http
          - proxy-socks
          - tor
          - client-transmission
          - client-deluge
          - client-qbittorrent-delayed
    name: e2e (${{ matrix.profile }})
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv and Python
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: "3.14"
          enable-cache: true

      - name: Sync dependencies
        run: make install-python-dev

      - name: Run e2e platform (${{ matrix.profile }})
        run: tests/e2e/platform/run-e2e.sh env/${{ matrix.profile }}.env

      - name: Dump BookFlow logs on failure
        if: failure()
        run: cat tests/e2e/platform/.state/bookflow.${{ matrix.profile }}.log || true

  e2e-full:
    runs-on: ubuntu-latest
    name: e2e (full)
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv and Python
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: "3.14"
          enable-cache: true

      - name: Sync dependencies
        run: make install-python-dev

      - name: Run full pipeline
        run: tests/e2e/platform/run-e2e.sh env/full.env

      - name: Dump logs on failure
        if: failure()
        run: |
          cat tests/e2e/platform/.state/bookflow.full.log || true
          docker logs e2e-qbittorrent || true
